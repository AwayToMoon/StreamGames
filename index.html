<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Anime Bewertungen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>⭐ Anime Bewerten mit Emir & Ale ⭐</h1>
            <p>Bewerte deine Lieblingsanimes mit Sternen</p>
        </header>

        <main class="content">
            <div id="anime-container" class="anime-container">
                <!-- Anime card wird hier generiert -->
            </div>
            
            <div class="load-more-container">
                <button id="load-more-btn" class="btn-load-more" disabled>
                    <span>Bitte erst bewerten</span>
                    <i class="arrow">→</i>
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
