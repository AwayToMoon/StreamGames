<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Character Liste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">
                <span class="title-icon">⚡</span>
                Anime Character Ranking
            </h1>
            <p class="subtitle">Ranke Charaktere von OP bis Sehr Schwach</p>
        </header>

        <!-- Ranking View -->
        <div id="ranking-view" class="ranking-view active">
            <div class="ranking-container">
                <div class="ranking-column" data-rank="unranked">
                    <div class="ranking-header unranked">
                        <h2><i class="fas fa-question-circle"></i> Unranked</h2>
                        <span class="count" id="count-unranked">0</span>
                    </div>
                    <div class="ranking-list" id="list-unranked" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <div class="ranking-column" data-rank="op">
                    <div class="ranking-header op">
                        <h2><i class="fas fa-crown"></i> OP</h2>
                        <span class="count" id="count-op">0</span>
                    </div>
                    <div class="ranking-list" id="list-op" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <div class="ranking-column" data-rank="stark">
                    <div class="ranking-header stark">
                        <h2><i class="fas fa-fire"></i> Stark</h2>
                        <span class="count" id="count-stark">0</span>
                    </div>
                    <div class="ranking-list" id="list-stark" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <div class="ranking-column" data-rank="mittel">
                    <div class="ranking-header mittel">
                        <h2><i class="fas fa-balance-scale"></i> Mittel</h2>
                        <span class="count" id="count-mittel">0</span>
                    </div>
                    <div class="ranking-list" id="list-mittel" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <div class="ranking-column" data-rank="schwach">
                    <div class="ranking-header schwach">
                        <h2><i class="fas fa-exclamation-triangle"></i> Schwach</h2>
                        <span class="count" id="count-schwach">0</span>
                    </div>
                    <div class="ranking-list" id="list-schwach" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <div class="ranking-column" data-rank="sehr-schwach">
                    <div class="ranking-header sehr-schwach">
                        <h2><i class="fas fa-times-circle"></i> Sehr Schwach</h2>
                        <span class="count" id="count-sehr-schwach">0</span>
                    </div>
                    <div class="ranking-list" id="list-sehr-schwach" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Image Search Modal -->
    <div id="image-search-modal" class="image-modal">
        <div class="image-modal-content">
            <div class="image-modal-header">
                <h2 id="modal-character-name">Charakter Bilder</h2>
                <button class="image-modal-close" id="close-image-modal">&times;</button>
            </div>
            <div class="image-modal-body">
                <iframe id="google-image-iframe" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
